<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="qt-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#34D399"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0F172A"/>
  <!-- Stylized candlesticks and line chart -->
  <rect x="6" y="16" width="3" height="8" rx="0.5" fill="#EF4444"/>
  <line x1="7.5" y1="12" x2="7.5" y2="26" stroke="#EF4444" stroke-width="1"/>

  <rect x="12" y="10" width="3" height="10" rx="0.5" fill="#10B981"/>
  <line x1="13.5" y1="6" x2="13.5" y2="24" stroke="#10B981" stroke-width="1"/>

  <rect x="18" y="14" width="3" height="6" rx="0.5" fill="#EF4444"/>
  <line x1="19.5" y1="10" x2="19.5" y2="22" stroke="#EF4444" stroke-width="1"/>

  <rect x="24" y="6" width="3" height="12" rx="0.5" fill="#10B981"/>
  <line x1="25.5" y1="4" x2="25.5" y2="20" stroke="#10B981" stroke-width="1"/>

  <!-- Glowing green trend line -->
  <path d="M 7.5,20 L 13.5,12 L 19.5,16 L 25.5,8" fill="none" stroke="url(#qt-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>